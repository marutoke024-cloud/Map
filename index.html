<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SPOTS — Favorite Places Atlas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#1B3C53" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <div id="app">
      <!-- The map stage -->
      <svg id="stage" aria-label="Japan map"></svg>

      <!-- Floating logo that drifts over the sea on the Japan view -->
      <div class="sea-logo" id="sea-logo" aria-hidden="true">
        <div class="sea-logo-mark">SPOTS</div>
        <div class="sea-logo-sub">FAVORITE&nbsp;PLACES&nbsp;ATLAS</div>
      </div>

      <!-- Atmospheric overlays -->
      <div class="fx-vignette" aria-hidden="true"></div>

      <!-- Heads-up display -->
      <header class="hud-top">
        <button class="back-btn" id="btn-back" hidden>
          <span class="back-arrow"></span> BACK
        </button>
        <nav class="breadcrumb" id="breadcrumb" aria-label="Navigation"></nav>

        <div class="searchbar" id="searchbar">
          <span class="search-ico"></span>
          <input id="search-input" placeholder="Search spots — name, budget, station…" autocomplete="off" />
          <button class="search-clear" id="search-clear" hidden>×</button>
        </div>

        <div class="hud-controls">
          <button class="icon-btn icon-btn--add" id="btn-add" title="Add a spot">
            <span class="icon-plus"></span>
            <span class="icon-label">ADD</span>
          </button>
          <button class="icon-btn" id="btn-private" title="Toggle private mode" aria-pressed="false">
            <span class="icon-lock"></span>
            <span class="icon-label">PRIVATE</span>
          </button>
          <button class="icon-btn" id="btn-stations" title="Toggle stations" aria-pressed="true">
            <span class="icon-rail"></span>
            <span class="icon-label">STATIONS</span>
          </button>
          <button class="icon-btn" id="btn-locate" title="Show my location">
            <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3.4" />
              <circle cx="12" cy="12" r="7.5" fill="none" />
              <path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3" />
            </svg>
            <span class="icon-label">GPS</span>
          </button>
          <button class="icon-btn" id="btn-settings" title="Settings">
            <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3.2" />
              <path d="M12 2.2v2.4M12 19.4v2.4M2.2 12h2.4M19.4 12h2.4M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7" />
            </svg>
            <span class="icon-label">SETTINGS</span>
          </button>
        </div>
      </header>

      <!-- Search results dropdown -->
      <div class="search-results" id="search-results" hidden></div>

      <footer class="hud-bottom">
        <div class="hint" id="hint"></div>
        <div class="scalebar">
          <span class="scalebar-line"></span>
          <span class="scalebar-label" id="scale-label">JAPAN</span>
        </div>
        <button class="all-places" id="btn-list">
          <span class="dot"></span> All places
        </button>
      </footer>

      <!-- Region / prefecture title that fades in on zoom -->
      <div class="stage-title" id="stage-title" aria-hidden="true">
        <span class="stage-title-ja"></span>
        <span class="stage-title-en"></span>
      </div>

      <!-- Pin detail panel -->
      <aside class="panel" id="panel" hidden></aside>

      <!-- Settings panel -->
      <aside class="panel" id="settings" hidden></aside>

      <!-- Places list drawer -->
      <aside class="drawer" id="drawer" hidden></aside>

      <!-- Intro loader: the app name fills like liquid being poured, by % -->
      <div class="loader" id="loader">
        <div class="loader-grid" aria-hidden="true"></div>
        <div class="loader-stage">
          <svg class="lp" viewBox="0 0 1000 300" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
            <defs>
              <linearGradient id="lp-grad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#ece0d6" />
                <stop offset="0.55" stop-color="#d2c1b6" />
                <stop offset="1" stop-color="#9fb6c6" />
              </linearGradient>
              <clipPath id="lp-clip">
                <text x="500" y="220" text-anchor="middle" class="lp-cliptext">SPOTS</text>
              </clipPath>
            </defs>
            <text x="500" y="220" text-anchor="middle" class="lp-ghost">SPOTS</text>
            <g clip-path="url(#lp-clip)">
              <g id="lp-liquid"><path id="lp-wave" /></g>
            </g>
            <text x="500" y="220" text-anchor="middle" class="lp-stroke">SPOTS</text>
          </svg>
          <div class="loader-meta"><span id="loader-num">0</span><em>%</em><i id="loader-status">loading</i></div>
        </div>
        <div class="loader-curtain" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
